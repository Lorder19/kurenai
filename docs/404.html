<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found · Kurenai</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/kurenai/icon.png">
<style>
  :root { --paper: #f3efe8; --ink: #1b1918; --soft: #6d6660; --line: #d9d2c7; --red: #c8232f; --red-ink: #8f141d; }
  @media (prefers-color-scheme: dark) { :root { --paper: #131211; --ink: #ece7df; --soft: #9a938a; --line: #2c2926; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { display: flex; align-items: center; gap: 32px; padding: 24px; flex-wrap: wrap; justify-content: center; }
  img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; object-position: 50% 15%; border: 3px solid var(--line); }
  h1 { font-size: 88px; line-height: 1; margin: 0; color: var(--red); letter-spacing: -0.03em; }
  p { margin: 8px 0 22px; font-size: 20px; }
  a { display: inline-block; background: var(--red); color: #fff; text-decoration: none; padding: 11px 18px; border-radius: 10px; font-weight: 600; }
  a:hover { background: var(--red-ink); }
</style>
</head>
<body>
<main>
  <img src="/kurenai/mascot/unimpressed.jpg" alt="">
  <div>
    <h1>404</h1>
    <p id="say">Nothing here. Not even on the clipboard.</p>
    <a id="home" href="/kurenai/">Back home</a>
  </div>
</main>
<script>
  const l = (navigator.language || '').toLowerCase();
  if (l.startsWith('ru')) { say.textContent = 'Здесь пусто. Даже в буфере.'; home.textContent = 'На главную'; home.href = '/kurenai/ru/'; }
  else if (l.startsWith('zh')) { say.textContent = '这里什么也没有，剪贴板里也没有。'; home.textContent = '回首页'; home.href = '/kurenai/zh/'; }
</script>
</body>
</html>
