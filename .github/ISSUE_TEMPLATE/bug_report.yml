name: Bug report
description: Something doesn't work the way it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kurenai version
      description: Kurenai menu > Settings, or the zip you downloaded.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 15.4, MacBook Air M2"
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: Which app were you copying from or pasting into?
      placeholder: "Chrome, Telegram, Excel..."
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots help. Please don't paste anything private from your clipboard.
