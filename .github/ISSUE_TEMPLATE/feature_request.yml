name: Feature request
description: Suggest something Kurenai should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation. "I copy order numbers from a spreadsheet and..." is more useful than "add X".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How would you like it to work?
