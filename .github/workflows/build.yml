name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: ./build.sh
      - name: Check both architectures
        run: lipo -archs build/Kurenai.app/Contents/MacOS/Kurenai
      - name: Check translation files
        run: plutil -lint Resources/*/Localizable.strings
